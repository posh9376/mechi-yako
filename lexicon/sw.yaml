# Kiswahili football lexicon — demo-match terms only (m-demo-001).
#
# Every entry and sample is UNREVIEWED until a native Kiswahili speaker signs it off.
# Set `review: approved` per entry (and `review.status` below) only after that review.
#
# Fields per term:
#   id        stable key used by the narrator and language QA
#   en / sw   headword in each language
#   sw_forms  stems the QA accepts as "this term was used" (case-insensitive substring)
#   en_forms  same for English narratives
#   gloss_en / gloss_sw  one-line explanation for the newcomer persona
#   formal    broadcast-register phrasing, when it differs from the headword

version: 1
language: sw
match_scope: m-demo-001

review:
  status: pending
  reviewer: null
  note: Native-speaker review of every term and sample line is required before release.

registers:
  formal:
    label: Formal broadcast
    description: >
      Present-tense match commentary as heard on radio and TV. Full sentences, teams treated
      as plural subjects (Red Kites wanasawazisha), minutes as "dakika ya N", score as
      "Blue Herons 1–1 Red Kites".
    guide:
      - Use present tense for live action (anafunga, wanabana).
      - Teams take plural agreement (wa-), players singular (a-).
      - Minutes are digits after "dakika ya"; small counts are words (mara nne).
      - Keep club and player names in their original form; never translate them.
      - No slang, no exclamation marks.
    samples:
      - moment_type: goal
        fixture_moment: mom-goal-equaliser-01
        text: "Dakika ya 63, Omar Diallo anafunga bao la kusawazisha kwa Red Kites. Matokeo sasa ni Blue Herons 1–1 Red Kites."
        facts: {minute: 63, scorer: RK-9, score_after: [1, 1]}
      - moment_type: pressure_spell
        fixture_moment: mom-pressure-01
        text: "Kati ya dakika ya 55 na 61, Red Kites wanawabana Blue Herons katika nusu yao ya uwanja na kuwanyang'anya mpira mara tano."
        facts: {high_turnovers: 5, t_start: "55:05", t_end: "61:45"}
      - moment_type: momentum_swing
        fixture_moment: mom-momentum-01
        text: "Mwelekeo wa mchezo umebadilika. Kwa kuwabana Blue Herons, Red Kites wamegeuza matokeo kutoka 1–0 hadi 1–1."
        facts: {score_before: [1, 0], score_after: [1, 1]}
      - moment_type: shot_after_turnovers
        fixture_moment: mom-shot-after-turnovers-01
        text: "Baada ya kunyang'anya mpira mara nne katika nusu ya Blue Herons, Red Kites wanapata nafasi: Omar Diallo anapiga shuti, na kipa analiokoa."
        facts: {turnovers_before_shot: 4, shot_outcome: saved}
      - moment_type: player_milestone
        fixture_moment: mom-milestone-01
        text: "Dakika ya 78, Makena Aoko wa Red Kites anakaba kwa mafanikio kwa mara ya tano katika mchezo huu."
        facts: {value: 5, player: RK-4}

  casual:
    label: Casual banter
    description: >
      Terrace and radio-phone-in energy. Short exclamations, idioms such as "kutikisa nyavu"
      (to shake the net), and no statistics.
    guide:
      - Exclamations are fine (Goooli!), but keep facts exact.
      - Idioms over technical terms: kutikisa nyavu, wanawabana vilivyo, ni ukuta.
      - Never add numbers that are not in the fact layer.
    samples:
      - moment_type: goal
        fixture_moment: mom-goal-equaliser-01
        text: "Goooli! Omar Diallo anatikisa nyavu dakika ya 63! Red Kites wamesawazisha, sasa ni 1–1. Mchezo upya!"
        facts: {minute: 63, scorer: RK-9, score_after: [1, 1]}

  simple:
    label: Simple explainer
    description: >
      For newcomers. Short sentences, past/perfect tense, one idea per sentence, and every
      football term explained once in plain words.
    guide:
      - One idea per sentence.
      - Prefer "amefunga bao" over idioms such as "kutikisa nyavu".
      - Follow a technical term with its gloss from this lexicon.

# Terms the language QA expects for each moment type (all must appear).
moment_terms:
  pressure_spell: [press, turnover]
  shot_after_turnovers: [turnover, shot]
  momentum_swing: [momentum, press]
  goal: [goal]
  player_milestone: [tackle]

terms:
  - id: goal
    en: goal
    sw: bao
    sw_forms: [bao, goli, nyavu]
    en_forms: [goal, scor]
    formal: kufunga bao
    gloss_en: A goal is scored when the whole ball crosses the line between the posts.
    gloss_sw: Bao linapatikana pale mpira wote unapovuka mstari kati ya milingoti ya lango.
    review: pending
  - id: equaliser
    en: equaliser
    sw: bao la kusawazisha
    sw_forms: [kusawazisha, wamesawazisha, anasawazisha]
    en_forms: [equalis, level]
    gloss_en: An equaliser is the goal that makes the score level again.
    gloss_sw: Bao la kusawazisha ni bao linalofanya matokeo kuwa sawa tena.
    review: pending
  - id: press
    en: press / pressing
    sw: kubana
    sw_forms: [bana, presha, shinikizo]
    en_forms: [press]
    formal: kuwabana wapinzani
    gloss_en: Pressing means chasing the opponents high up the pitch to win the ball back quickly.
    gloss_sw: Kubana ni pale wachezaji wanapowakimbilia wapinzani mapema ili kuwanyang'anya mpira haraka.
    review: pending
  - id: high_press
    en: high press
    sw: presha ya juu
    sw_forms: [presha ya juu, kubana juu]
    en_forms: [high press, pressed high, pressing high]
    gloss_en: A high press happens near the opponents' own goal, far from your own.
    gloss_sw: Presha ya juu hufanyika karibu na lango la wapinzani, mbali na lango lako.
    review: pending
  - id: turnover
    en: turnover / won the ball
    sw: kunyang'anya mpira
    sw_forms: ["nyang'anya mpira", "nyang'anywa mpira", nyakua mpira, poteza mpira]
    en_forms: [turnover, won the ball, win the ball, winning the ball, giving the ball away, gave the ball away, lost the ball]
    gloss_en: A turnover is when one team loses the ball and the other team takes it.
    gloss_sw: Kunyang'anywa mpira ni pale timu inapoupoteza mpira na wapinzani wake kuuchukua.
    review: pending
  - id: tackle
    en: tackle
    sw: kukaba
    sw_forms: [kaba]
    en_forms: [tackle]
    formal: kukaba kwa mafanikio
    gloss_en: A tackle is when a defender takes the ball off an opponent's feet.
    gloss_sw: Kukaba ni pale beki anapomnyang'anya mpinzani mpira kutoka miguuni mwake.
    review: pending
  - id: interception
    en: interception
    sw: kunasa pasi
    sw_forms: [nasa pasi]
    en_forms: [intercept]
    gloss_en: An interception is cutting out a pass before it reaches its target.
    gloss_sw: Kunasa pasi ni kuikata pasi kabla haijamfikia aliyelengwa.
    review: pending
  - id: shot
    en: shot
    sw: shuti
    sw_forms: [shuti]
    en_forms: [shot, shoot]
    formal: kupiga shuti
    gloss_en: A shot is an attempt to score by striking the ball toward goal.
    gloss_sw: Shuti ni jaribio la kufunga kwa kuupiga mpira kuelekea langoni.
    review: pending
  - id: save
    en: save
    sw: kuokoa
    sw_forms: [okoa]
    en_forms: [save, saved]
    gloss_en: A save is when the goalkeeper stops a shot from going in.
    gloss_sw: Kuokoa ni pale kipa anapozuia shuti lisiingie wavuni.
    review: pending
  - id: goalkeeper
    en: goalkeeper
    sw: kipa
    sw_forms: [kipa, mlinda mlango]
    en_forms: [goalkeeper, keeper]
    gloss_en: The goalkeeper is the only player allowed to handle the ball in their own box.
    gloss_sw: Kipa ndiye mchezaji pekee anayeruhusiwa kushika mpira ndani ya eneo lake.
    review: pending
  - id: momentum
    en: momentum
    sw: mwelekeo wa mchezo
    sw_forms: [mwelekeo wa mchezo, upepo wa mchezo]
    en_forms: [momentum, swung, swing, flipped, turned the game]
    gloss_en: Momentum is which team is on top and pushing the game in its direction.
    gloss_sw: Mwelekeo wa mchezo ni timu ipi iko juu na inaupeleka mchezo upande wake.
    review: pending
  - id: possession
    en: possession
    sw: umiliki wa mpira
    sw_forms: [umiliki wa mpira, kumiliki mpira]
    en_forms: [possession]
    gloss_en: Possession is how much of the time a team has the ball.
    gloss_sw: Umiliki wa mpira ni muda ambao timu inakaa na mpira.
    review: pending
  - id: own_half
    en: own half
    sw: nusu yao ya uwanja
    sw_forms: [nusu yao, nusu ya uwanja]
    en_forms: [own half]
    gloss_en: A team's own half is the half of the pitch with the goal it defends.
    gloss_sw: Nusu ya timu ya uwanja ni upande wenye lango inalolinda.
    review: pending
